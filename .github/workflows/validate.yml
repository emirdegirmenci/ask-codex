name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Validate plugin manifest and components
        run: |
          claude plugin validate --strict .
          for dir in skills agents commands; do
            if [ -d "$dir" ]; then claude plugin validate --strict "$dir"; fi
          done

      - name: Plugin and marketplace versions match
        run: |
          python - <<'PY'
          import json
          plugin = json.load(open(".claude-plugin/plugin.json", encoding="utf-8"))
          market = json.load(open(".claude-plugin/marketplace.json", encoding="utf-8"))
          entry = next(p for p in market["plugins"] if p["name"] == plugin["name"])
          assert entry["version"] == plugin["version"], (entry["version"], plugin["version"])
          print(f"{plugin['name']} {plugin['version']}")
          PY

      - name: Compile Python scripts
        run: python -m compileall -q -x '/\.git/' .

      - name: MODELS.md is generated and matches the routing allowlist
        run: |
          python - <<'PY'
          import importlib.util, pathlib, re
          spec = importlib.util.spec_from_file_location("sync", "scripts/sync-models.py")
          sync = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(sync)
          allowed = set(sync.ALLOWED_MODELS)
          models_md = pathlib.Path("skills/ask-codex/MODELS.md").read_text(encoding="utf-8")
          assert "Generated file" in models_md, "MODELS.md must be generated by scripts/sync-models.py"
          missing = [s for s in sync.ALLOWED_MODELS if f"| `{s}` |" not in models_md]
          assert not missing, f"MODELS.md is missing approved models: {missing}"
          for path in ["skills/ask-codex/SKILL.md", "skills/ask-codex/MODELS.md", "agents/codex-teammate.md"]:
              slugs = set(re.findall(r"`(gpt-[0-9][\w.-]*)`", pathlib.Path(path).read_text(encoding="utf-8")))
              stray = slugs - allowed
              assert not stray, f"{path} references models outside the allowlist: {sorted(stray)}"
          print("MODELS.md and routing references OK:", sorted(allowed))
          PY
